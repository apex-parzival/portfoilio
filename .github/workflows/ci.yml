name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The sitemap is generated during build — if it differs from what is
      # committed, someone added a project without regenerating it.
      - name: Check sitemap is up to date
        run: git diff --exit-code -- public/sitemap.xml public/robots.txt
